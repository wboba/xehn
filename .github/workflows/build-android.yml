name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.26.10
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - name: Checkout (xehn-android)
        uses: actions/checkout@v4
        with:
          ref: xehn-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go (pinned by engine/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform / build-tools / NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build engine.aar (gomobile bind)
        working-directory: engine
        run: |
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -javapkg=com.xiaohe -target=android/arm64,android/arm -androidapi=24 -ldflags=-w -o ../app/libs/engine.aar .

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xehn-android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
